<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Online Tag Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container" id="home-screen">
    <h1>🏷️ Online Tag Game</h1>
    <input type="text" id="game-code-input" placeholder="Enter game code" maxlength="6" />
    <button onclick="joinGame()">Join Game</button>
    <p>or</p>
    <button onclick="createGame()">Create Game</button>
  </div>

  <div class="container" id="game-screen" style="display: none;">
    <h2>Game Code: <span id="game-code-display"></span></h2>
    <p><strong>You:</strong> <span id="your-id"></span></p>
    <p><strong>Role:</strong> <span id="your-role">Waiting...</span></p>
    <div id="host-controls" style="display:none;">
      <button onclick="startGame()">Start Game</button>
    </div>
    <h3>Players:</h3>
    <ul id="player-list"></ul>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

    firebase.initializeApp(firebaseConfig);
  </script>
  <script src="main.js"></script>
</body>
</html>
